name: Test custom lock reasons
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          process-only: 'issues,prs'
          issue-inactive-days: '365'
          issue-lock-reason: 'off-topic'
          pr-inactive-days: '365'
          pr-lock-reason: 'spam'
          log-output: 'true'
      - name: Assert action ran with custom lock reasons or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          PRS: ${{ steps.action.outputs.prs }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "prs: $PRS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom lock reasons"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
