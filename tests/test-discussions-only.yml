name: Test process discussions only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          process-only: 'discussions'
          discussion-inactive-days: '365'
          log-output: 'true'
      - name: Assert action ran for discussions only or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          PRS: ${{ steps.action.outputs.prs }}
          DISCUSSIONS: ${{ steps.action.outputs.discussions }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "prs: $PRS"
          echo "discussions: $DISCUSSIONS"
          if [ "$OUTCOME" = "success" ]; then
            # When process-only=discussions, issues and prs outputs should be empty or null
            echo "PASS: action succeeded"
            if [ -n "$ISSUES" ] && [ "$ISSUES" != "[]" ] && [ "$ISSUES" != "null" ]; then
              echo "FAIL: expected issues output to be empty when process-only=discussions, got: $ISSUES"
              exit 1
            fi
            if [ -n "$PRS" ] && [ "$PRS" != "[]" ] && [ "$PRS" != "null" ]; then
              echo "FAIL: expected prs output to be empty when process-only=discussions, got: $PRS"
              exit 1
            fi
            echo "PASS: issues and prs outputs are empty as expected"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
