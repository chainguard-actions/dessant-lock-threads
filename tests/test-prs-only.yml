name: Test process pull requests only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          process-only: 'prs'
          pr-inactive-days: '365'
          pr-lock-reason: 'resolved'
          log-output: 'true'
      - name: Assert action ran for prs only or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          PRS: ${{ steps.action.outputs.prs }}
          DISCUSSIONS: ${{ steps.action.outputs.discussions }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "prs: $PRS"
          echo "discussions: $DISCUSSIONS"
          if [ "$OUTCOME" = "success" ]; then
            # When process-only=prs, issues and discussions outputs should be empty or null
            echo "PASS: action succeeded"
            if [ -n "$ISSUES" ] && [ "$ISSUES" != "[]" ] && [ "$ISSUES" != "null" ]; then
              echo "FAIL: expected issues output to be empty when process-only=prs, got: $ISSUES"
              exit 1
            fi
            if [ -n "$DISCUSSIONS" ] && [ "$DISCUSSIONS" != "[]" ] && [ "$DISCUSSIONS" != "null" ]; then
              echo "FAIL: expected discussions output to be empty when process-only=prs, got: $DISCUSSIONS"
              exit 1
            fi
            echo "PASS: issues and discussions outputs are empty as expected"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
